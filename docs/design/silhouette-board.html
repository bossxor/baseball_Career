<h1>119 실루엣 14종</h1>
<p>사람 얼굴·체형 없이 던지는 손·타석·투구폼만 보여줍니다. 팔레트만 바꿔 팀/NPC를 표현합니다. 투수는 오른팔 던지는 손이 정면 기준 왼쪽에 보입니다. 이 보드는 정적 시안이며 실제 렌더·접근성 검수는 하지 않았습니다.</p>
