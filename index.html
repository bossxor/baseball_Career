<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이번 생은 야구다 (clone)</title>
<style>
body{font:15px system-ui;max-width:640px;margin:auto;padding:16px;background:#111;color:#eee}
button{margin:3px;padding:8px 12px;border:0;border-radius:6px;background:#2a6;color:#fff;cursor:pointer}
button.alt{background:#555}pre{background:#000;padding:8px;height:200px;overflow:auto;white-space:pre-wrap}
td,th{padding:2px 8px;text-align:right}
</style>
<h2>⚾ 이번 생은 야구다</h2>
<div id=hud></div><div id=act></div><pre id=log></pre>
<table id=hist></table>
<script>
const LEVELS=[["고교",40],["대학",50],["2군",58],["1군",74]]; // [name, pitcher strength]
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
let P=JSON.parse(localStorage.slb||"null")||{age:18,month:3,lv:0,cond:100,hist:[],
  s:{contact:35,power:35,eye:35,speed:35},cur:{G:0,PA:0,AB:0,H:0,HR:0,BB:0,RBI:0}};
const save=()=>localStorage.slb=JSON.stringify(P);
const ovr=()=>Object.values(P.s).reduce((a,b)=>a+b)/4;
const log=t=>{const l=document.getElementById("log");l.textContent+=t+"\n";l.scrollTop=1e9};

// one plate appearance -> 'K','BB','OUT','1B','2B','3B','HR'
function pa(){
  const {contact,power,eye,speed}=P.s, L=LEVELS[P.lv][1], f=P.cond/100*0.2+0.8;
  const d=(x)=>(x*f-L)/100;           // edge vs this league's pitching
  const bb=.09+d(eye)*.25, k=.22-d(contact)*.3, r=Math.random();
  if(r<bb)return"BB"; if(r<bb+k)return"K";
  const hit=.30+d(contact)*.4;        // BABIP-ish
  if(Math.random()>hit)return"OUT";
  const hr=.08+d(power)*.35, x2=.2+d(power)*.2, x3=.02+d(speed)*.05, q=Math.random();
  return q<hr?"HR":q<hr+x3?"3B":q<hr+x3+x2?"2B":"1B";
}
function game(){
  let c=P.cur; c.G++;
  for(let i=0;i<4;i++){const o=pa(); c.PA++; if(o=="BB")c.BB++; else{c.AB++;
    if(!["K","OUT"].includes(o)){c.H++; if(o=="HR"){c.HR++;c.RBI+=1+(Math.random()<.3)} else if(Math.random()<.3)c.RBI++;}}}
}
const avg=c=>c.AB?(c.H/c.AB).toFixed(3):"-.---";

function train(k){
  if(k=="rest"){P.cond=Math.min(100,P.cond+40);log("휴식. 컨디션 회복");}
  else{const g=R(1.5,4)*(P.age<30?1:.4)*P.cond/100; P.s[k]=Math.min(99,P.s[k]+g);P.cond-=20;log(`${k} 훈련 +${g.toFixed(1)}`);}
  month();
}
function month(){
  const n=P.month>=4&&P.month<=9?(P.lv==3?24:20):0; // season Apr-Sep
  for(let i=0;i<n;i++)game();
  if(n)log(`${P.month}월 누적 ${avg(P.cur)} ${P.cur.HR}HR ${P.cur.RBI}타점`);
  P.cond=Math.min(100,P.cond+15);
  if(++P.month>12){P.month=1;endYear()}
  render();save();
}
function endYear(){
  const c=P.cur; P.hist.push({age:P.age,lv:LEVELS[P.lv][0],...c});
  log(`== ${P.age}세 ${LEVELS[P.lv][0]} 시즌: ${avg(c)} ${c.HR}HR ${c.RBI}타점 ==`);
  P.cur={G:0,PA:0,AB:0,H:0,HR:0,BB:0,RBI:0}; P.age++;
  const need=[0,45,52,60][P.lv+1];            // promotion thresholds on OVR
  if(P.lv<3&&ovr()>=need&&avg(c)>.24){P.lv++;log(`🎉 승격! → ${LEVELS[P.lv][0]}`)}
  if(P.age>31)for(const k in P.s)P.s[k]-=R(0,2.5); // aging
  if(P.age>=40||(P.age>34&&avg(c)<.2)){log("은퇴했습니다.");P.over=1}
}
function render(){
  const c=P.cur;
  hud.innerHTML=`<b>${P.age}세</b> ${P.month}월 · ${LEVELS[P.lv][0]} · OVR ${ovr().toFixed(1)} · 컨디션 ${P.cond|0}<br>`+
   Object.entries(P.s).map(([k,v])=>`${k} ${v.toFixed(1)}`).join(" · ")+`<br>올해 ${avg(c)} ${c.HR}HR ${c.RBI}타점`;
  act.innerHTML=P.over?`<button onclick="localStorage.clear();location.reload()">새 인생</button>`:
   Object.keys(P.s).map(k=>`<button onclick="train('${k}')">${k} 훈련</button>`).join("")+
   `<button class=alt onclick="train('rest')">휴식</button>`;
  hist.innerHTML="<tr><th>나이<th>리그<th>타율<th>HR<th>타점"+P.hist.map(h=>`<tr><td>${h.age}<td>${h.lv}<td>${avg(h)}<td>${h.HR}<td>${h.RBI}`).join("");
}
render();
</script>
